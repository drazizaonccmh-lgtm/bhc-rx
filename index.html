:root{--red:#A50510;--red-deep:#7A0A10;--ink:#111418;--ink2:#2B2F33;--gray:#4E565C;--mute:#6F777D;--bronze:#9B672D;--gold:#D1A351;--ivory:#FAF6F3;--mist:#F1F3F4;--line:#E3E6E8;--warn:#FDECEE;--bg:#F7F4F1;--card:#fff;--radius:14px;--font:"Noto Kufi Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.muted{color:var(--mute)} .small{font-size:12.5px} .err{color:var(--red);font-weight:600} .center{text-align:center}
bdi,[dir=ltr]{unicode-bidi:isolate}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:#fff;border-bottom:1px solid var(--line)}
.tb-logo{height:32px;width:auto}
.tb-title{display:flex;flex-direction:column;line-height:1.25;flex:1}
.tb-title strong{font-size:16px} .tb-title .muted{font-size:12px}
.tabs{display:flex;gap:4px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:calc(49px + env(safe-area-inset-top));z-index:19}
.tabs button{flex:1;min-height:44px;border:0;background:transparent;border-radius:10px;font-weight:700;color:var(--gray);white-space:nowrap;padding:0 14px}
.tabs button.on{background:var(--ivory);color:var(--red);box-shadow:inset 0 -2px 0 var(--red)}
#view{max-width:1240px;margin:0 auto;padding:12px 16px}
.banner{max-width:1240px;margin:10px auto 0;padding:10px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;margin-inline:16px}
.banner.warn{background:#FFF8E8;border-color:#F0D9A0}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--red);font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 120px;min-width:0}
.row>.grow{flex:3 1 200px}
.row.wide>*{flex:1 1 180px}
.row.actions{align-items:center;margin-top:6px}
.row.actions>*{flex:0 0 auto}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field>span{font-size:13px;font-weight:700;color:var(--gray)}
input,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--mist);transition:border-color .15s,background .15s}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(165,5,16,.12)}
input[dir=ltr]{text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer}
.chip:active{background:var(--ivory)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--mist)}
.seg button{flex:1;min-height:44px;border:0;background:transparent;font-weight:700;color:var(--gray);cursor:pointer}
.seg button.on{background:var(--red);color:#fff}

.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.small{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--red)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{min-width:40px;min-height:40px;border:0;background:transparent;border-radius:10px;font-size:16px;cursor:pointer;color:var(--gray)}
.icon-btn:disabled{opacity:.3}
:focus-visible{outline:3px solid rgba(165,5,16,.45);outline-offset:2px}

.doc-title{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
.doc-title strong{font-size:17px}
.med{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:10px}
.med.warn{background:var(--warn)}
.med .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:2px}
.med-txt{flex:1;display:flex;flex-direction:column;cursor:pointer;min-width:0}
.med-txt strong{font-size:15.5px}
.med-act{display:flex}

.actionbar{position:fixed;inset-inline:0;bottom:0;z-index:30;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.actionbar .btn{flex:1}
.actionbar .btn:last-child{flex:0 0 52px}

.preview-col{display:none}
.live canvas{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 6px 24px rgba(17,20,24,.12);margin-bottom:12px;background:#fff}

.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.item>div:first-child{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.item-act{display:flex;gap:6px;flex-wrap:wrap}
.search{margin-bottom:4px}
.toggle{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}
.toggle input{width:22px;height:22px;min-height:0;accent-color:var(--red)}
.sig{width:100%;max-width:520px;height:auto;aspect-ratio:600/220;border:1px dashed var(--bronze);border-radius:12px;background:#fff;touch-action:none;display:block;margin:8px 0}
.sig-cur{max-height:70px;display:block;margin:6px 0;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff}

dialog.sheet{border:0;padding:0;border-radius:18px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.sheet:not([open]){display:none}
dialog.sheet.wide{width:min(760px,calc(100vw - 24px))}
dialog.sheet::backdrop{background:rgba(17,20,24,.45)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-body{padding:14px 16px;overflow:auto}
.sheet-foot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.pv-pages{overflow:auto;padding:14px;background:var(--mist)}
.pv-pages img{display:block;width:100%;max-width:520px;margin:0 auto 14px;box-shadow:0 6px 20px rgba(0,0,0,.15);background:#fff}
.menu{display:flex;flex-direction:column;padding:8px}
.menu-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;border:0;background:transparent;padding:12px;border-radius:10px;cursor:pointer;min-height:52px}
.menu-item:hover{background:var(--ivory)}

#lock{min-height:100dvh;display:grid;place-items:center;padding:24px}
.lock-card{width:min(360px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center}
.lock-logo{height:56px;margin-bottom:6px}
.lock-card h1{font-size:20px;margin:4px 0}
.pin{text-align:center;font-size:24px;letter-spacing:8px;margin:14px 0 4px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-weight:600;max-width:calc(100vw - 32px);text-align:center;transition:opacity .4s}
.toast.out{opacity:0}
body.busy::after{content:"جارٍ التجهيز…";position:fixed;inset:0;background:rgba(255,255,255,.7);display:grid;place-items:center;font-weight:800;color:var(--red);z-index:98}
.print-frame{position:fixed;width:0;height:0;border:0;visibility:hidden}

@media (min-width:1024px){
  body{padding-bottom:84px}
  .editor-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;align-items:start}
  .preview-col{display:block;position:sticky;top:120px}
  .actionbar{inset-inline:auto;left:50%;transform:translateX(-50%);width:min(1240px,100%);border:1px solid var(--line);border-radius:16px 16px 0 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.bmi-out{display:block;min-height:44px;padding:10px 12px;border:1px dashed var(--line,#E3E6E8);border-radius:10px;font-weight:800;background:#FAF6F3}
</style>
</head>

<div id="app" hidden></div>

    const ms = size * BHCQR_SPEC.markRatio, cs = size * BHCQR_SPEC.codeRatio;

  svg(text, markHref, size = 1000) {

    return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" shape-rendering="crispEdges">`
      + `<rect width="${size}" height="${size}" fill="${BHCQR_SPEC.background}"/>`
      + `<image href="${markHref}" xlink:href="${markHref}" x="${L.mark.x.toFixed(2)}" y="${L.mark.x.toFixed(2)}" width="${L.mark.size.toFixed(2)}" height="${L.mark.size.toFixed(2)}"/>`

/* ================================================================
   BHC Rx — rendering engine (A5 prescription on canvas, mm units)
   ================================================================ */
'use strict';

const FONT = '"Noto Kufi Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif';
const C = {
  red: '#A50510', redDeep: '#82121A', ink: '#111418', ink2: '#2B2F33',
  gray: '#4E565C', mute: '#7D858B', bronze: '#9B672D', gold: '#D1A351', goldPale: '#F5D078',
  ivory: '#FAF6F3', line: '#E3E6E8', lineWarm: '#ece4df', slate: '#22303c', warn: '#FBEBEC',
};
const PT = 0.352778;            // 1pt in mm
const A5 = { W: 148, H: 210 };
const hasAr = (s) => /[؀-ۿ]/.test(s || '');

/* ---------- painter: every coordinate in mm ---------- */
class Painter {
  constructor(ctx, k, dry = false) { this.c = ctx; this.k = k; this.dry = dry; }
  font(pt, w = 500) { this.c.font = `${w} ${pt * PT * this.k}px ${FONT}`; }
  width(s, pt, w = 500, dir = 'rtl') {
    this.font(pt, w); this.c.direction = dir; if ('letterSpacing' in this.c) this.c.letterSpacing = '0px';
    return this.c.measureText(String(s ?? '')).width / this.k;
  }
  text(s, x, y, o = {}) {
    if (this.dry || s === undefined || s === null || s === '') return;
    const { pt = 9, w = 500, color = C.ink, align = 'right', dir = 'rtl', alpha, ls } = o;
    const c = this.c; this.font(pt, w);
    if ('letterSpacing' in c) c.letterSpacing = ls ? `${ls * this.k}px` : '0px';
    c.direction = dir; c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillStyle = color;
    if (alpha !== undefined) { c.save(); c.globalAlpha = alpha; }
    c.fillText(String(s), x * this.k, y * this.k);
    if (alpha !== undefined) c.restore();
  }
  fit(s, maxW, pt, w, dir, min = 6) {
    let size = pt; while (size > min && this.width(s, size, w, dir) > maxW) size -= 0.25;
    let t = String(s);
    if (this.width(t, size, w, dir) > maxW) {
      while (t.length > 1 && this.width(t + '…', size, w, dir) > maxW) t = t.slice(0, -1);
      t += '…';
    }
    return { t, size };
  }
  wrap(s, maxW, pt, w = 500) {
    const out = [];
    for (const para of String(s || '').split('\n')) {
      const words = para.split(/\s+/).filter(Boolean);
      if (!words.length) continue;
      let cur = '';
      for (const wd of words) {
        const t = cur ? `${cur} ${wd}` : wd;
        if (!cur || this.width(t, pt, w, hasAr(t) ? 'rtl' : 'ltr') <= maxW) cur = t; else { out.push(cur); cur = wd; }
      }
      out.push(cur);
    }
    return out;
  }
  rr(x, y, w, h, r, o = {}) {
    if (this.dry) return; const c = this.c, k = this.k; r = Math.min(r, w / 2, h / 2);
    c.beginPath(); c.moveTo((x + r) * k, y * k);
    c.arcTo((x + w) * k, y * k, (x + w) * k, (y + h) * k, r * k);
    c.arcTo((x + w) * k, (y + h) * k, x * k, (y + h) * k, r * k);
    c.arcTo(x * k, (y + h) * k, x * k, y * k, r * k);
    c.arcTo(x * k, y * k, (x + w) * k, y * k, r * k); c.closePath();
    if (o.grad) { c.fillStyle = this.grad(x, 0, x + w, 0, o.grad); c.fill(); } else if (o.fill) { c.fillStyle = o.fill; c.fill(); }
    if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = (o.lw || 0.25) * k; c.stroke(); }
  }
  rect(x, y, w, h, fill) { if (this.dry) return; this.c.fillStyle = fill; this.c.fillRect(x * this.k, y * this.k, w * this.k, h * this.k); }
  line(x1, y1, x2, y2, o = {}) {
    if (this.dry) return; const c = this.c, k = this.k; c.save(); c.beginPath();
    c.moveTo(x1 * k, y1 * k); c.lineTo(x2 * k, y2 * k);
    c.strokeStyle = o.grad ? this.grad(x1, 0, x2, 0, o.grad) : (o.color || C.line); c.lineWidth = (o.lw || 0.2) * k; c.lineCap = 'round';
    if (o.dash) c.setLineDash(o.dash.map((d) => d * k)); c.stroke(); c.restore();
  }
  grad(x0, y0, x1, y1, stops) {
    const g = this.c.createLinearGradient(x0 * this.k, y0 * this.k, x1 * this.k, y1 * this.k);
    stops.forEach(([o, col]) => g.addColorStop(o, col)); return g;
  }
  gradRect(x, y, w, h, stops) { if (this.dry) return; this.c.fillStyle = this.grad(x, 0, x + w, 0, stops); this.c.fillRect(x * this.k, y * this.k, w * this.k, h * this.k); }
  clipRR(x, y, w, h, r, fn) {
    if (this.dry) return; const c = this.c, k = this.k; c.save(); c.beginPath();
    c.moveTo((x + r) * k, y * k); c.arcTo((x + w) * k, y * k, (x + w) * k, (y + h) * k, r * k); c.arcTo((x + w) * k, (y + h) * k, x * k, (y + h) * k, r * k);
    c.arcTo(x * k, (y + h) * k, x * k, y * k, r * k); c.arcTo(x * k, y * k, (x + w) * k, y * k, r * k); c.closePath(); c.clip(); fn(); c.restore();
  }
  circle(cx, cy, r, fill) { if (this.dry) return; const c = this.c, k = this.k; c.beginPath(); c.arc(cx * k, cy * k, r * k, 0, Math.PI * 2); c.fillStyle = fill; c.fill(); }
  img(im, x, y, w, h, alpha = 1) {
    if (this.dry || !im || !im.naturalWidth) return; const c = this.c, k = this.k;
    c.save(); c.globalAlpha = alpha; c.drawImage(im, x * k, y * k, w * k, h * k); c.restore();
  }
  qr(matrix, x, y, size, color = C.ink) {
    if (this.dry || !matrix) return; const n = matrix.length, m = size / n, c = this.c, k = this.k;
    c.fillStyle = color;
    const px = (v) => Math.round(v * k); // snap to device pixels so neighbouring modules leave no hairline seams
    for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) if (matrix[r][q]) { const x0 = px(x + q * m), y0 = px(y + r * m); c.fillRect(x0, y0, px(x + (q + 1) * m) - x0, px(y + (r + 1) * m) - y0); }
  }
}

/* ---------- dates ---------- */
const pad2 = (n) => String(n).padStart(2, '0');
const isoToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
function dateObj(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function fmtDate(iso, kind = 'greg') {
  if (!iso) return '';
  try {
    if (kind === 'hijri') return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }).format(dateObj(iso)).replace(/\s*هـ$/, '') + ' هـ';
    if (kind === 'weekday') return new Intl.DateTimeFormat('ar-u-nu-latn', { weekday: 'long' }).format(dateObj(iso));
    return new Intl.DateTimeFormat('ar-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }).format(dateObj(iso));
  } catch { return iso; }
}

/* ---------- prescription text helpers ---------- */
const sigLine = (m) => [m.amount && m.form ? `${m.amount} (${m.form})` : (m.amount || m.form), m.freq, m.timing].filter(Boolean).join('  •  ');
const durText = (x) => { x = (x || '').trim(); if (!x) return ''; return /^(لمدة|مستمر|حتى|بشكل)/.test(x) ? x : `لمدة ${x}`; };
const LRI = '⁦', PDI = '⁩';
const isolate = (s) => (s ? LRI + s + PDI : '');

/* ---------- layout (design approved by the owner on 2026-10-25, decision D37) ----------
   Header: horizontal logo (right), gold divider, specialty (left).
   Patient box: red frame, centred tab «وصفة طبية | Prescription», name/age/sex, file/date/allergies, diagnosis.
   Vital signs: narrow table (BP, HR, SpO2, BW, BMI; SpO2 added by the owner 2026-10-26) at the far right under the patient box.
   Rx area with writing room; next visit + signature; red-flag line; red footer with the QR in the corner. */
const WATERMARK_ALPHA = 0.1; // effective strength on paper (owner 2026-10-26: the watermark did not show when printed)
const M = 8;                         // page margin (mm)
const HEAD_BOTTOM = 27.7;            // header rule
const FOOT_H = 19, FOOT_TOP = A5.H - FOOT_H;
const VIT_ROWS = 5;
const VIT = { w: 29, head: 6.5, row: 8.2, key: 12.5 };
const VIT_H = VIT.head + VIT_ROWS * VIT.row;
const BOX_H = 24;
const FLAGS_H = 4.6, FLAGS_TOP = FOOT_TOP - 2.4 - FLAGS_H;
const ZONE_H = 11.5, ZONE_TOP = FLAGS_TOP - 2 - ZONE_H;

/* BMI from weight (kg) and height (cm); empty when either is missing or implausible. */
function bmiOf(d) {
  const w = parseFloat(String(d.weight || '').replace(',', '.')), hcm = parseFloat(String(d.height || '').replace(',', '.'));
  if (!(w >= 20 && w <= 300 && hcm >= 100 && hcm <= 230)) return '';
  return (w / ((hcm / 100) ** 2)).toFixed(1);
}

function specialtyLines(s) { const i = s.indexOf(' و'); return i > 0 ? [s.slice(0, i), s.slice(i + 1)] : [s]; }

function drawHeader(P, set, assets) {
  const W = A5.W;
  P.gradRect(0, 0, W, 2, [[0, C.redDeep], [1, C.red]]); P.rect(0, 2, W, 0.5, C.gold);
  const lh = 22, lw = lh * 7792 / 2612, ly = 4.3;
  P.img(assets.logo, W - M - lw, ly, lw, lh);
  const lines = specialtyLines(set.clinic.specialty), pt = 10;
  const tw = Math.max(...lines.map((l) => P.width(l, pt, 700)));
  const cy = ly + lh / 2;
  lines.forEach((l, i) => P.text(l, M + tw / 2, cy - (lines.length - 1) * 2.7 + i * 5.4 + 1.3, { pt, w: 700, color: C.slate, align: 'center' }));
  P.line(M + tw + 3.6, cy - 6.5, M + tw + 3.6, cy + 6.5, { color: C.gold, lw: 0.35 });
  P.line(M, HEAD_BOTTOM, W - M, HEAD_BOTTOM, { color: C.lineWarm, lw: 0.3 });
}

function drawFooter(P, set, assets) {
  const W = A5.W, y0 = FOOT_TOP;
  P.gradRect(0, y0, W, FOOT_H, [[0, C.redDeep], [1, C.red]]); P.rect(0, y0, W, 0.5, C.gold);
  let left = M, right = W - 7;
  if (set.showQr && assets.qr) {
    // the one BHC QR design (D36) in the footer corner (D33)
    const ts = 15.2, qx = 4, qy = y0 + 0.5 + (FOOT_H - 0.5 - ts) / 2, inner = 14, L = BHCQR.layout(inner);
    P.rr(qx, qy, ts, ts, 1.6, { fill: '#fff', stroke: C.goldPale, lw: 0.35 });
    const ix = qx + (ts - inner) / 2, iy = qy + (ts - inner) / 2;
    P.img(assets.qrMark, ix + L.mark.x, iy + L.mark.x, L.mark.size, L.mark.size);
    P.qr(assets.qr, ix + L.code.x, iy + L.code.x, L.code.size, BHCQR.spec.dark);
    const sw = Math.max(P.width('امسح', 6, 700), P.width('للحجز', 6, 700)), sx = qx + ts + 1.8 + sw / 2;
    P.text('امسح', sx, y0 + 9.4, { pt: 6, w: 700, color: C.goldPale, align: 'center' });
    P.text('للحجز', sx, y0 + 12.2, { pt: 6, w: 700, color: C.goldPale, align: 'center' });
    left = qx + ts + 1.8 + sw + 3;
  }
  const cx = (left + right) / 2;
  // identity footer (D33): row 1 numbers and website, row 2 address
  const items = [['هاتف العيادة', set.clinic.phone], ['واتساب', set.clinic.whatsapp], ['', set.clinic.website]];
  const pt = 7.4, gap = 4;
  const parts = items.map(([l, v]) => { const lw = l ? P.width(l, pt, 600) + 1.2 : 0; const vw = P.width(v, pt, 700, 'ltr'); return { l, v, lw, vw, w: lw + vw }; });
  let x = cx + (parts.reduce((a, p) => a + p.w, 0) + gap * (parts.length - 1)) / 2;
  for (const p of parts) {
    if (p.l) P.text(p.l, x, y0 + 8.1, { pt, w: 600, color: C.goldPale });
    P.text(p.v, x - p.lw - p.vw, y0 + 8.1, { pt, w: 700, color: '#fff', dir: 'ltr', align: 'left' });
    x -= p.w + gap;
  }
  const f = P.fit(set.clinic.address, right - left, 6.6, 500, 'rtl', 5.4);
  P.text(f.t, cx, y0 + 13.6, { pt: f.size, w: 500, color: 'rgba(255,255,255,.9)', align: 'center' });
}

/* One labelled field on a dotted line: label at the right, value written on the line. */
function field(P, label, value, xr, w, y, o = {}) {
  const S = o.S !== false, lw = P.width(label, 7.4, 800);
  if (S) {
    P.text(label, xr, y, { pt: 7.4, w: 800, color: o.labelColor || C.redDeep });
    P.line(xr - w, y + 0.6, xr - lw - 1.6, y + 0.6, { color: C.gray, lw: 0.25, dash: [0.3, 0.55] });
  }
  if (!value) return;
  const dir = o.dir || (hasAr(value) ? 'rtl' : 'ltr');
  const f = P.fit(value, w - lw - 3, 8.2, 700, dir, 6);
  P.text(f.t, xr - lw - 2.4, y - 0.4, { pt: f.size, w: 700, color: o.color || C.ink, dir, align: 'right' });
}

function patientBox(P, d, set, S) {
  const W = A5.W, top = HEAD_BOTTOM + 3.6, x = M, w = W - 2 * M, p = d.patient || {};
  const al = (d.allergies || '').trim(), alNone = /^(لا\s*(يوجد|توجد)|—|-|none|nkda)/i.test(al), alWarn = al && !alNone;
  if (S) {
    P.rr(x, top, w, BOX_H, 2.4, { fill: C.ivory, stroke: C.red, lw: 0.35 });
    const t1 = 'وصفة طبية', t2 = 'Prescription', w1 = P.width(t1, 8.6, 800), w2 = P.width(t2, 6.8, 700, 'ltr') + 0.4 * (t2.length - 1);
    const tabW = w1 + w2 + 2 * 2.4 + 0.35 + 9, tx = W / 2 - tabW / 2, ty = top - 2.9;
    P.rr(tx, ty, tabW, 6, 1.4, { grad: [[0, C.redDeep], [1, C.red]] });
    let r = tx + tabW - 4.5;
    P.text(t1, r, ty + 4.3, { pt: 8.6, w: 800, color: '#fff' }); r -= w1 + 2.4;
    P.line(r, ty + 1.3, r, ty + 4.7, { color: C.goldPale, lw: 0.35 }); r -= 2.4;
    P.text(t2, r, ty + 4.1, { pt: 6.8, w: 700, color: '#fff', dir: 'ltr', align: 'right', ls: 0.4 });
  }
  if (d.no) P.text(`No. ${d.no}`, M + 1, top - 1, { pt: 6, w: 700, color: C.bronze, dir: 'ltr', align: 'left' });
  const inner = w - 6.8, gap = 3.5, xr0 = W - M - 3.4;
  const row = (cells, y) => {
    const tf = cells.reduce((a, c) => a + c.f, 0), avail = inner - gap * (cells.length - 1); let xr = xr0;
    cells.forEach((c) => { const cw = avail * c.f / tf; field(P, c.l, c.v, xr, cw, y, { S, dir: c.dir, color: c.color, labelColor: c.lc }); xr -= cw + gap; });
  };
  const date = d.date ? fmtDate(d.date) : '';
  row([{ l: 'اسم المريض', v: p.name, f: 3.2 }, { l: 'العمر', v: p.age ? `${p.age} سنة` : '', f: 1 }, { l: 'الجنس', v: p.sex, f: 1 }], top + 7.4);
  row([{ l: 'رقم الملف', v: p.fileNo, f: 1.3, dir: 'ltr' }, { l: 'التاريخ', v: date, f: 1.5 },
    { l: 'الحساسية الدوائية', v: al, f: 2.4, color: alWarn ? C.red : C.ink, lc: alWarn ? C.red : C.redDeep }], top + 14);
  row([{ l: 'التشخيص', v: (d.diagnosis || '').replace(/\s*\n\s*/g, '، '), f: 1 }], top + 20.6);
  return top + BOX_H;
}

function vitalsTable(P, d, x, y, S) {
  const { w, head, row, key } = VIT, vals = [d.bp, d.hr, d.spo2, d.weight, bmiOf(d)];
  // [label, label subscript, unit, unit superscript]
  const rows = [['BP', '', 'mmHg'], ['HR', '', 'bpm'], ['SpO', '2', '%'], ['BW', '', 'kg'], ['BMI', '', 'kg/m', '2']];
  if (S) {
    P.clipRR(x, y, w, VIT_H, 2, () => {
      P.rect(x, y, w, VIT_H, '#fff'); P.rect(x, y, w, head, C.red);
      P.rect(x, y + head, key, VIT_H - head, C.ivory);
      P.line(x + key, y + head, x + key, y + VIT_H, { color: C.line, lw: 0.25 });
      for (let i = 1; i < VIT_ROWS; i++) P.line(x, y + head + i * row, x + w, y + head + i * row, { color: C.line, lw: 0.25 });
    });
    P.rr(x, y, w, VIT_H, 2, { stroke: C.red, lw: 0.35 });
    P.text('VITAL SIGNS', x + w / 2, y + 4.3, { pt: 6, w: 800, color: '#fff', dir: 'ltr', align: 'center', ls: 0.1 });
  }
  rows.forEach(([a, sub, u, sup], i) => {
    const ry = y + head + i * row;
    if (S) {
      P.text(a, x + 1.4, ry + 3.9, { pt: 7.4, w: 800, color: C.slate, dir: 'ltr', align: 'left' });
      if (sub) P.text(sub, x + 1.4 + P.width(a, 7.4, 800, 'ltr') + 0.2, ry + 4.7, { pt: 4.6, w: 800, color: C.slate, dir: 'ltr', align: 'left' });
      P.text(u, x + 1.4, ry + 6.6, { pt: 5.4, w: 600, color: C.gray, dir: 'ltr', align: 'left' });
      if (sup) P.text(sup, x + 1.4 + P.width(u, 5.4, 600, 'ltr') + 0.2, ry + 5.6, { pt: 3.8, w: 600, color: C.gray, dir: 'ltr', align: 'left' });
    }
    if (vals[i]) {
      const f = P.fit(String(vals[i]), w - key - 2, 8.2, 800, 'ltr', 6);
      P.text(f.t, x + key + (w - key) / 2, ry + 5.3, { pt: f.size, w: 800, color: C.ink, dir: 'ltr', align: 'center' });
    }
  });
  return y + VIT_H;
}

/* The medicines section follows the reading direction of drug names:
   LTR (default) puts numbers and names on the left; RTL mirrors it. `xr` is the right limit. */
function medBlock(P, m, i, y, s, flagged, ltr, xr) {
  const xl = M, badge = 7;
  const X = (dist) => (ltr ? xl + dist : xr - dist);
  const start = ltr ? 'left' : 'right';
  const dur = durText(m.duration);
  const chipW = dur ? Math.max(15, P.width(dur, 7 * s, 700) + 5) : 0;
  const tw = (xr - xl) - badge - (chipW ? chipW + 3 : 0);
  const nameStr = [m.name, m.strength].filter(Boolean).join('  ');
  const nameDir = hasAr(m.name) ? 'rtl' : 'ltr';
  const l2 = P.wrap(sigLine(m), tw, 8 * s);
  const notes = m.note ? P.wrap(`ملاحظة: ${m.note}`, tw, 7.4 * s) : [];
  const h = 3 + 4.6 * s + l2.length * 3.9 * s + notes.length * 3.5 * s + 1.8;
  P.circle(X(3.2), y + 3.6, 2.9, flagged ? C.redDeep : C.red);
  P.text(String(i + 1), X(3.2), y + 4.75, { pt: 7.2, w: 800, color: '#fff', align: 'center', dir: 'ltr' });
  const f = P.fit(nameStr, tw, 10.2 * s, 700, nameDir, 7);
  const ny = y + 4.9 * s + 0.2, tx = X(badge + 1);
  P.text(f.t, tx, ny, { pt: f.size, w: 700, color: C.ink, dir: nameDir, align: start });
  let ty = ny + 4.3 * s;
  for (const l of l2) { P.text(l, tx, ty, { pt: 8 * s, w: 500, color: C.gray, dir: hasAr(l) ? 'rtl' : 'ltr', align: start }); ty += 3.9 * s; }
  for (const l of notes) { P.text(l, tx, ty, { pt: 7.4 * s, w: 600, color: C.bronze, dir: 'rtl', align: start }); ty += 3.5 * s; }
  if (dur) {
    const cx = ltr ? xr - chipW : xl;
    P.rr(cx, y + 0.8, chipW, 5.6, 2.8, { fill: C.ivory, stroke: C.gold, lw: 0.3 });
    P.text(dur, cx + chipW / 2, y + 4.7, { pt: 7 * s, w: 700, color: C.bronze, align: 'center' });
  }
  return h;
}

function textBox(P, title, text, y, s, xr, o = {}) {
  const xl = M, pad = 2.4, tw = xr - xl - 2 * pad - 1.5;
  const lines = P.wrap(text, tw, 8.2 * s);
  const h = pad + 4.6 + lines.length * 3.75 * s + 1.2;
  P.rr(xl, y, xr - xl, h, 2.2, { fill: '#fff', stroke: C.line, lw: 0.25 });
  P.rect(xr - 1.1, y + 2.4, 1.1, h - 4.8, o.bar || C.gold);
  P.text(title, xr - pad - 1.4, y + pad + 2.6, { pt: 6.4, w: 800, color: o.titleColor || C.red });
  let ty = y + pad + 7;
  for (const l of lines) { P.text(l, xr - pad - 1.4, ty, { pt: 8.2 * s, w: 500, color: C.ink2, dir: hasAr(l) ? 'rtl' : 'ltr' }); ty += 3.75 * s; }
  return h;
}

/* Next visit (left), signature (right). */
function bottomZone(P, d, set, assets, blank, S) {
  const W = A5.W, y = ZONE_TOP, nw = 77, sw = 43.5, sx = W - M - sw;
  if (!blank && assets.signature) {
    const im = assets.signature, ih = 9, iw = Math.min(sw - 4, ih * im.naturalWidth / im.naturalHeight);
    P.img(im, sx + (sw - iw) / 2, y - ih - 0.3, iw, ih);
  }
  if (S) {
    P.line(sx, y + 1, W - M, y + 1, { color: C.gray, lw: 0.3 });
    P.text('توقيع وختم الطبيب', sx + sw / 2, y + 5.6, { pt: 7.2, w: 700, color: C.gray, align: 'center' });
    P.text(set.clinic.doctor, sx + sw / 2, y + 9.4, { pt: 6.2, w: 500, color: C.gray, align: 'center' });
    P.rr(M, y, nw, ZONE_H - 0.5, 2.2, { fill: C.ivory, stroke: C.gold, lw: 0.35 });
    P.text('موعد المراجعة القادم', M + nw - 3, y + 4, { pt: 6.8, w: 700, color: C.gray });
    if (blank || !d.nextDate) P.line(M + 3, y + 8.6, M + nw - 3, y + 8.6, { color: C.gray, lw: 0.25, dash: [0.3, 0.55] });
  }
  if (d.nextDate && !blank) {
    const f = P.fit(`${fmtDate(d.nextDate, 'weekday')} ${fmtDate(d.nextDate)}`, nw - 6, 8.2, 800, 'rtl', 6.2);
    P.text(f.t, M + nw - 3, y + 8.8, { pt: f.size, w: 800, color: C.red });
    if (d.nextNote) { const g = P.fit(d.nextNote, nw - 8 - P.width(f.t, f.size, 800), 6.6, 600, 'rtl', 5.4); P.text(g.t, M + 3, y + 8.8, { pt: g.size, w: 600, color: C.gray, align: 'left' }); }
  } else if (d.nextNote && !blank) P.text(P.fit(d.nextNote, nw - 6, 7, 600, 'rtl', 5.4).t, M + nw - 3, y + 8.6, { pt: 7, w: 600, color: C.gray });
}

/**
 * Lays out the whole prescription into one or more A5 pages.
 * Returns [{draw(ctx,k), paint(P)}] so the caller can render each page to a canvas at any resolution, or to SVG.
 * Pre-printed paper (settings.paper === 'pre') skips everything already printed on the blank form and writes only the values.
 */
function planPages(d, set, assets, opts = {}) {
  const blank = !!opts.blank, S = set.paper !== 'pre';
  const meas = document.createElement('canvas').getContext('2d');
  const Pm = new Painter(meas, 4, true);
  const W = A5.W, rxTop = HEAD_BOTTOM + 3.6 + BOX_H + 2.2, vitX = W - M - VIT.w, vitBottom = rxTop + VIT_H;
  const bottomTop = ZONE_TOP - 2;                    // medicines stop here on the last page
  const flowTop = rxTop + 10, contTop = HEAD_BOTTOM + 11;
  const xrAt = (y, first) => (first && y < vitBottom + 1 ? vitX - 3 : W - M);
  const flagged = (m) => {
    const al = (d.allergies || '').toLowerCase().trim(); const n = (m.name || '').toLowerCase().trim();
    if (!al || !n || /^(لا\s*(يوجد|توجد))/.test(al)) return false;
    return al.split(/[،,\s]+/).some((w) => w.length > 2 && n.includes(w)) || al.includes(n.split(' ')[0]);
  };
  const meds = blank ? [] : d.meds;
  const ltr = true; // owner 2026-10-26: medications always read left to right (drug names and doses in English)

  // try a single page with progressive scaling; otherwise paginate at scale 0.9
  const fitsOne = (s) => {
    let y = flowTop;
    for (const m of meds) y += medBlockH(Pm, m, s, xrAt(y, true));
    if (d.tests) y += boxH(Pm, d.tests, s, xrAt(y, true)) + 2;
    if (d.advice) y += boxH(Pm, d.advice, s, xrAt(y, true)) + 2;
    return y <= bottomTop;
  };
  let s = 1; while (s > 0.8 && !fitsOne(s)) s -= 0.04;
  const pages = [];
  if (fitsOne(s)) pages.push({ meds: meds.map((m, i) => ({ m, i })), tail: true, first: true });
  else {
    s = 0.9; let y = flowTop, cur = [], first = true;
    meds.forEach((m, i) => {
      const h = medBlockH(Pm, m, s, xrAt(y, first));
      if (y + h > FLAGS_TOP - 2 && cur.length) { pages.push({ meds: cur, tail: false, first }); cur = []; first = false; y = contTop; }
      cur.push({ m, i }); y += h;
    });
    const tail = (d.tests ? boxH(Pm, d.tests, s, W - M) + 2 : 0) + (d.advice ? boxH(Pm, d.advice, s, W - M) + 2 : 0);
    if (y + tail > bottomTop) { pages.push({ meds: cur, tail: false, first }); pages.push({ meds: [], tail: true, first: false }); }
    else pages.push({ meds: cur, tail: true, first });
  }

  const pagesCount = pages.length;
  const paint = (P, pg, pi) => {
    P.rect(0, 0, A5.W, A5.H, '#fff');
    if (S) {
      // identity rule (D33): the large primary logo as a faint watermark over the writing area
      if (assets.watermark) { const ww = 96; P.img(assets.watermark, (W - ww) / 2, 126 - ww / 2, ww, ww, WATERMARK_ALPHA); }
      drawHeader(P, set, assets); drawFooter(P, set, assets);
    }
    let y;
    if (pg.first) {
      const shown = blank ? { patient: {} } : d;    // the blank form carries no patient data, not even today's date
      patientBox(P, shown, set, S);
      vitalsTable(P, shown, vitX, rxTop, S);
      if (S) {
        P.text('Rx', M, rxTop + 7.6, { pt: 21, w: 900, color: C.red, dir: 'ltr', align: 'left' });
        P.line(M + 14, rxTop + 4.6, vitX - 3, rxTop + 4.6, { grad: [[0, C.gold], [1, 'rgba(209,163,81,0)']], lw: 0.35 });
      }
      y = flowTop;
    } else {
      P.text(`تابع الوصفة — صفحة ${pi + 1} من ${pagesCount}`, W - M, HEAD_BOTTOM + 6, { pt: 7, w: 700, color: C.gray });
      P.text(d.patient?.name || '', M, HEAD_BOTTOM + 6, { pt: 7, w: 700, color: C.ink2, align: 'left' });
      y = contTop;
    }
    if (blank && S) {
      // writing lines: beside the vital signs, then across the full width
      for (let ly = flowTop + 8.2; ly < ZONE_TOP - 3; ly += 8.2) P.line(M, ly, xrAt(ly, true), ly, { color: C.line, lw: 0.25 });
    }
    pg.meds.forEach(({ m, i }, j) => {
      const xr = xrAt(y, pg.first);
      const h = medBlock(P, m, i, y, s, flagged(m), ltr, xr);
      y += h;
      if (j < pg.meds.length - 1) P.line(ltr ? M + 7 : M + 6, y - 0.8, ltr ? xr - 6 : xr - 7, y - 0.8, { color: C.line });
    });
    if (pg.meds.length) y += 1.5;
    if (pg.tail) {
      if (d.tests && !blank) y += textBox(P, 'الفحوصات المطلوبة', d.tests, y, s, xrAt(y, pg.first), { bar: C.gray, titleColor: C.gray }) + 2;
      if (d.advice && !blank) y += textBox(P, 'تعليمات وملاحظات', d.advice, y, s, xrAt(y, pg.first)) + 2;
      bottomZone(P, d, set, assets, blank, S);
      if (S && set.redflags) {
        P.rr(M, FLAGS_TOP, W - 2 * M, FLAGS_H, 1.6, { fill: C.warn });
        const f = P.fit(set.redflags, W - 2 * M - 6, 5.6, 700, 'rtl', 4.8);
        P.text(f.t, W / 2, FLAGS_TOP + 3.1, { pt: f.size, w: 700, color: C.red, align: 'center' });
      }
    } else P.text('يتبع ←', M, FLAGS_TOP + 3, { pt: 6.6, w: 700, color: C.gray, align: 'left' });
  };
  return pages.map((pg, pi) => ({
    scale: s,
    draw(ctx, k) { paint(new Painter(ctx, k), pg, pi); },
    paint(P) { paint(P, pg, pi); },
  }));
}

/* measurement helpers (dry) */
function medBlockH(P, m, s, xr) {
  const dur = durText(m.duration), chipW = dur ? Math.max(15, P.width(dur, 7 * s, 700) + 5) : 0;
  const tw = (xr - M) - 7 - (chipW ? chipW + 3 : 0);
  const l2 = P.wrap(sigLine(m), tw, 8 * s).length, notes = m.note ? P.wrap(`ملاحظة: ${m.note}`, tw, 7.4 * s).length : 0;
  return 3 + 4.6 * s + l2 * 3.9 * s + notes * 3.5 * s + 1.8;
}
function boxH(P, text, s, xr) { const tw = xr - M - 2 * 2.4 - 1.5; return 2.4 + 4.6 + P.wrap(text, tw, 8.2 * s).length * 3.75 * s + 1.2; }

/* Renders all pages to canvases at the given dpi. */
function renderPages(d, set, assets, dpi = 300, opts = {}) {
  const plan = planPages(d, set, assets, opts);
  const k = dpi / 25.4;
  return plan.map((pg) => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(A5.W * k); cv.height = Math.round(A5.H * k);
    pg.draw(cv.getContext('2d'), k);
    return cv;
  });
}

/* ================================================================
   Vector output: the same pages drawn as SVG (for printing).
   Text stays text in the clinic font, logos stay vector.
   ================================================================ */
class SvgPainter extends Painter {
  constructor() {
    super(document.createElement('canvas').getContext('2d'), 4, false);   // the canvas is used for measuring only
    this.out = []; this.defs = []; this.n = 0;
  }
  esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  paint(o) { return `fill="${o.fill || 'none'}"${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.lw || 0.25}"` : ''}`; }
  gradId(x0, x1, stops) {
    const id = `g${++this.n}`;
    this.defs.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x0}" y1="0" x2="${x1}" y2="0">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient>`);
    return `url(#${id})`;
  }
  text(s, x, y, o = {}) {
    if (s === undefined || s === null || s === '') return;
    const { pt = 9, w = 500, color = C.ink, align = 'right', dir = 'rtl', alpha, ls } = o;
    const anchor = align === 'center' ? 'middle' : ((align === 'right') === (dir === 'rtl') ? 'start' : 'end');
    this.out.push(`<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${(pt * PT).toFixed(3)}" font-weight="${w}" fill="${color}" direction="${dir}" text-anchor="${anchor}"${alpha !== undefined ? ` opacity="${alpha}"` : ''}${ls ? ` letter-spacing="${ls}"` : ''}>${this.esc(s)}</text>`);
  }
  rr(x, y, w, h, r, o = {}) {
    r = Math.min(r, w / 2, h / 2);
    const fill = o.grad ? this.gradId(x, x + w, o.grad) : o.fill;
    this.out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" ${this.paint({ ...o, fill })}/>`);
  }
  rect(x, y, w, h, fill) { this.out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`); }
  gradRect(x, y, w, h, stops) { this.rect(x, y, w, h, this.gradId(x, x + w, stops)); }
  line(x1, y1, x2, y2, o = {}) {
    const stroke = o.grad ? this.gradId(x1, x2, o.grad) : (o.color || C.line);
    this.out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${o.lw || 0.2}" stroke-linecap="round"${o.dash ? ` stroke-dasharray="${o.dash.join(' ')}"` : ''}/>`);
  }
  circle(cx, cy, r, fill) { this.out.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"/>`); }
  img(im, x, y, w, h, alpha = 1) {
    if (!im || !im.src) return;
    this.out.push(`<image href="${im.src}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="none"${alpha < 1 ? ` opacity="${alpha}"` : ''}/>`);
  }
  qr(matrix, x, y, size, color = C.ink) {
    if (!matrix) return; const n = matrix.length, m = size / n; let p = '';
    for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) if (matrix[r][q]) p += `M${(x + q * m).toFixed(3)} ${(y + r * m).toFixed(3)}h${m.toFixed(3)}v${m.toFixed(3)}h-${m.toFixed(3)}z`;
    this.out.push(`<path d="${p}" fill="${color}" shape-rendering="crispEdges"/>`);
  }
  clipRR(x, y, w, h, r, fn) {
    const id = `c${++this.n}`;
    this.defs.push(`<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/></clipPath>`);
    this.out.push(`<g clip-path="url(#${id})">`); fn(); this.out.push('</g>');
  }
  svg() {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${A5.W} ${A5.H}" width="${A5.W}mm" height="${A5.H}mm" font-family='"Noto Kufi Arabic",sans-serif'><defs>${this.defs.join('')}</defs>${this.out.join('')}</svg>`;
  }
}

/* All pages as SVG strings. */
function renderSvgPages(d, set, assets, opts = {}) {
  return planPages(d, set, assets, opts).map((pg) => { const P = new SvgPainter(); pg.paint(P); return P.svg(); });
}

/* QR encoder and the BHC QR layout come from apps/shared/bhc-qr.cjs (D36), concatenated before this file by build.py. */

/* ================================================================
   Minimal PDF writer: one image per A5 page (no libraries).
   Lossless (Flate) so text and logo edges stay sharp in print; JPEG only where the browser cannot compress.
   ================================================================ */
async function canvasesToPdf(canvases, meta = {}) {
  const enc = new TextEncoder();
  const chunks = []; let offset = 0; const offsets = [];
  const push = (data) => { const b = typeof data === 'string' ? enc.encode(data) : data; chunks.push(b); offset += b.length; };
  const obj = (n, body) => { offsets[n] = offset; push(`${n} 0 obj\n`); body(); push('\nendobj\n'); };
  const jpgs = [];
  for (const cv of canvases) {
    if (typeof CompressionStream !== 'undefined') {
      const px = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data, rgb = new Uint8Array(cv.width * cv.height * 3);
      for (let i = 0, j = 0; i < px.length; i += 4) { rgb[j++] = px[i]; rgb[j++] = px[i + 1]; rgb[j++] = px[i + 2]; }
      const zs = new Blob([rgb]).stream().pipeThrough(new CompressionStream('deflate'));
      jpgs.push({ bytes: new Uint8Array(await new Response(zs).arrayBuffer()), w: cv.width, h: cv.height, filter: 'FlateDecode' });
    } else {
      const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.95));
      jpgs.push({ bytes: new Uint8Array(await blob.arrayBuffer()), w: cv.width, h: cv.height, filter: 'DCTDecode' });
    }
  }
  const pw = (A5.W / 25.4 * 72).toFixed(2), ph = (A5.H / 25.4 * 72).toFixed(2);
  const n = jpgs.length; const pageIds = jpgs.map((_, i) => 4 + i * 3);
  const pdfStr = (s) => `<FEFF${[...s].map((ch) => ch.charCodeAt(0).toString(16).padStart(4, '0')).join('')}>`;
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Count ${n} /Kids [${pageIds.map((id) => `${id} 0 R`).join(' ')}] >>`));
  obj(3, () => push(`<< /Title ${pdfStr(meta.title || 'Prescription')} /Author ${pdfStr(meta.author || '')} /Producer (BHC Rx) /CreationDate (D:${new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)}) >>`));
  jpgs.forEach((j, i) => {
    const pid = pageIds[i], cid = pid + 1, iid = pid + 2;
    obj(pid, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im${i} ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im${i} Do Q`;
    obj(cid, () => { push(`<< /Length ${content.length} >>\nstream\n`); push(content); push('\nendstream'); });
    obj(iid, () => { push(`<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /${j.filter} /Length ${j.bytes.length} >>\nstream\n`); push(j.bytes); push('\nendstream'); });
  });
  const xref = offset, total = 4 + n * 3;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let i = 1; i < total; i++) push(`${String(offsets[i]).padStart(10, '0')} 00000 n \n`);
  push(`trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type: 'application/pdf' });
}

/* ================================================================
   BHC Rx — storage (device only) and encryption
   - IndexedDB, falls back to localStorage.
   - Optional PIN: the whole state is AES-GCM encrypted at rest with a
     key derived from the PIN (PBKDF2-SHA256, 310k iterations). The key
     lives only in memory and is dropped on lock.
   - Backups are always encrypted with their own password.
   ================================================================ */
'use strict';

const DB_NAME = 'bhc-rx', DB_STORE = 'kv';
const PBKDF2_ITER = 310000;
const b64 = {
  enc: (buf) => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); },
  dec: (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0)),
};
const hasCrypto = () => !!(globalThis.crypto && crypto.subtle);

const KV = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction(DB_STORE, mode); const st = t.objectStore(DB_STORE); const out = fn(st); t.oncomplete = () => res(out && 'result' in out ? out.result : undefined); t.onerror = () => rej(t.error); }); };
  return {
    async get(k) { try { return await tx('readonly', (s) => s.get(k)); } catch { try { const v = localStorage.getItem(`bhcrx:${k}`); return v ? JSON.parse(v) : undefined; } catch { return undefined; } } },
    async set(k, v) { try { await tx('readwrite', (s) => s.put(v, k)); return true; } catch { try { localStorage.setItem(`bhcrx:${k}`, JSON.stringify(v)); return true; } catch { return false; } } },
    async del(k) { try { await tx('readwrite', (s) => s.delete(k)); } catch { try { localStorage.removeItem(`bhcrx:${k}`); } catch { /* ignore */ } } },
  };
})();

const Crypto = {
  async deriveKey(secret, salt, iter = PBKDF2_ITER) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async seal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return { iv: b64.enc(iv), ct: b64.enc(ct) };
  },
  async open(key, box) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(box.iv) }, key, b64.dec(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  },
};

const Store = {

  meta: null,         // { pin: { salt, iter } } stored in clear

  async load() {

      h('div', { class: 'row' }, fld('اسم الدواء', 'name', { list: 'dl-meds', cls: 'grow', ph: 'Drug name', dir: 'auto' }), fld('التركيز', 'strength', { dir: 'ltr', ph: 'mg' })),
      h('div', { class: 'row' }, fld('الكمية في المرة', 'amount', { chips: CH.amount }), fld('الشكل الدوائي', 'form', { chips: CH.form })),

      fld('المدة', 'duration', { chips: CH.duration }),
      fld('ملاحظة خاصة', 'note', { ph: 'اختياري' }));
    sheet(index === null ? 'دواء جديد' : 'تعديل دواء', body, [
      ['حفظ', 'primary', () => {

      }],
      index === null ? ['حفظ وإضافة آخر', '', () => { if (!m.name.trim()) { toast('اكتب اسم الدواء'); return false; } d.meds.push(m); this.drawMeds(); this.touch(); setTimeout(() => this.editMed(null), 50); return true; }] : null,
    ]);

  /* ---------- live preview ---------- */
  pvTimer: null,
  schedulePreview(delay = 350) {
    if (!$('#live-pages') || !matchMedia('(min-width: 1024px)').matches) return;
    clearTimeout(this.pvTimer); this.pvTimer = setTimeout(() => this.drawLive(), delay);
  },
  drawLive() {
    const box = $('#live-pages'); if (!box) return;

    box.innerHTML = ''; pages.forEach((cv) => box.append(cv));

  },
  openPreview(opts = {}) {
    const pages = renderPages(opts.blank ? { ...newRx(), no: '' } : this.doc, Store.state.settings, this.assets, 200, opts);
    const wrap = h('div', { class: 'pv-pages' }, ...pages.map((cv) => h('img', { src: cv.toDataURL('image/png'), alt: 'معاينة الصفحة' })));
    sheet(`المعاينة — A5 ${pages.length > 1 ? `(${pages.length} صفحات)` : ''}`, wrap, [
      ['مشاركة', 'primary', () => { this.exportPdf('share', opts); return true; }],
      ['PDF', '', () => { this.exportPdf('save', opts); return true; }],

    ], { wide: true });
  },

  /* ---------- outputs ---------- */
  fileBase(opts = {}) {
    if (opts.blank) return 'وصفة-فارغة';
    const n = (this.doc.patient.name || 'مريض').replace(/[\\/:*?"<>|]+/g, '').trim().slice(0, 40);
    return `وصفة-${n}-${this.doc.no || this.doc.date}`;
  },
  async exportPdf(mode, opts = {}) {
    if (!opts.blank && !(await this.commit())) return;
    busy(true);
    try {
      const pages = renderPages(opts.blank ? newRx() : this.doc, Store.state.settings, this.assets, 400, opts);
      const blob = await canvasesToPdf(pages, { title: this.fileBase(opts), author: Store.state.settings.clinic.doctor });
      const file = new File([blob], `${this.fileBase(opts)}.pdf`, { type: 'application/pdf' });
      if (mode === 'share' && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: file.name }); } catch (e) { if (e.name !== 'AbortError') download(file); }
      } else download(file);
    } catch (e) { console.error(e); toast('تعذّر إنشاء الملف'); } finally { busy(false); }
  },
  async exportJpg() {
    if (!(await this.commit())) return;
    const pages = renderPages(this.doc, Store.state.settings, this.assets, 200);
    for (let i = 0; i < pages.length; i++) {
      const blob = await new Promise((r) => pages[i].toBlob(r, 'image/jpeg', 0.9));
      download(new File([blob], `${this.fileBase()}${pages.length > 1 ? `-${i + 1}` : ''}.jpg`, { type: 'image/jpeg' }));
    }
  },
  async print(opts = {}) {
    if (!opts.blank && !(await this.commit())) return;
    // vector print (D37): the pages as SVG, text in the clinic font, logos as vectors
    const svgs = renderSvgPages(opts.blank ? newRx() : this.doc, Store.state.settings, this.assets, opts);
    const fontFaces = [...document.styleSheets].flatMap((sh) => { try { return [...sh.cssRules]; } catch { return []; } }).filter((r) => r.constructor.name === 'CSSFontFaceRule').map((r) => r.cssText).join('');
    const fr = h('iframe', { class: 'print-frame', title: 'طباعة' }); document.body.append(fr);
    const doc = fr.contentDocument;
    doc.open(); doc.write(`<!doctype html><html lang="ar"><head><meta charset="utf-8"><style>${fontFaces}@page{size:A5 portrait;margin:0}html,body{margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pg{width:148mm;height:210mm;overflow:hidden;page-break-after:always;break-after:page}.pg:last-child{page-break-after:auto;break-after:auto}svg{display:block}</style></head><body>${svgs.map((sv) => `<div class="pg">${sv}</div>`).join('')}</body></html>`); doc.close();
    await doc.fonts.ready;
    // owner 2026-10-26: the page asks the printer for A5 at actual size; the reminder covers browsers that ignore it
    toast('في نافذة الطباعة: الورق A5 · الحجم الفعلي 100% · بلا هوامش', 4000);
    await new Promise((r) => setTimeout(r, 1200));
    fr.contentWindow.focus(); fr.contentWindow.print();
    setTimeout(() => fr.remove(), 60000);
  },
  moreMenu() {
    sheet('خيارات', h('div', { class: 'menu' },
      menuItem('طباعة', 'ورق A5 بالحجم الفعلي 100%', () => this.print()),

      menuItem('نموذج فارغ للكتابة اليدوية', 'PDF للطباعة بلا اسم مريض', () => this.exportPdf('save', { blank: true })),

  /* ---------- templates ---------- */
  async saveTemplate() {
    const d = this.doc; if (!d.meds.length) { toast('أضف دواءً واحداً على الأقل'); return; }
    const name = await ask('اسم النموذج العلاجي', d.diagnosis || ''); if (!name) return;

  pickTemplate() {

    if (!d.tests) d.tests = t.tests || ''; if (!d.advice) d.advice = t.advice || '';

      return h('label', { class: 'field' }, h('span', {}, label), el);
    };

      const el = h('input', { type: 'checkbox' }); el.checked = !!s[key];
      el.addEventListener('change', async () => { s[key] = el.checked; await save(); after && after(); });
      return h('label', { class: 'toggle' }, el, h('span', {}, label));
    };
    const paper = h('div', { class: 'seg' }, ...[['full', 'ترويسة كاملة'], ['pre', 'ورق مطبوع مسبقاً']].map(([k, l]) => h('button', { type: 'button', class: s.paper === k ? 'on' : '', onclick: async () => { s.paper = k; await save(); this.render(); } }, l)));
    v.append(
      card('الورق والطباعة',
        h('div', { class: 'field' }, h('span', {}, 'نوع الورق'), paper),
        s.paper === 'pre' ? h('p', { class: 'muted small' }, 'للورق المطبوع مسبقاً من «النموذج الفارغ»: تُكتب القيم فقط في أماكنها على النموذج.') : null,
        null,
        toggle('إظهار التاريخ الهجري', 'hijri'),
        toggle('رمز QR للحجز والمتابعة عبر واتساب', 'showQr', () => this.render()),
        s.showQr ? inp('رابط رمز QR', s, 'qrText', { dir: 'ltr' }) : null,
        inp('نص تحذير الطوارئ', s, 'redflags', { area: true }),
        h('p', { class: 'muted small' }, 'للطباعة: اختر A5 بحجم فعلي، أو A4 بخيار «صفحتان في الورقة» ثم قصّ المنتصف.')),
      card('التوقيع', this.signaturePad()),
      card('بيانات العيادة',
        h('p', { class: 'muted small' }, 'مأخوذة من البيانات المعتمدة للعيادة. لا تُعدَّل إلا عند تغيّرها رسمياً.'),
        inp('اسم الطبيب', s.clinic, 'doctor'), inp('التخصص', s.clinic, 'specialty'), inp('العنوان', s.clinic, 'address', { area: true }),
        h('div', { class: 'row wide' }, inp('هاتف العيادة', s.clinic, 'phone', { dir: 'ltr' }), inp('واتساب', s.clinic, 'whatsapp', { dir: 'ltr' }))),
      card('الأمان',
        h('p', { class: 'muted' }, Store.pinEnabled() ? 'البيانات مشفّرة برمز دخول، ويُغلق التطبيق تلقائياً بعد فترة عدم استخدام.' : 'البيانات محفوظة على هذا الجهاز فقط. يُنصح بتفعيل رمز دخول لتشفيرها.'),
        hasCrypto() ? h('div', { class: 'row actions' },
          h('button', { class: 'btn primary', onclick: async () => {
            const p1 = await ask('رمز دخول جديد (4 أرقام على الأقل)', '', false, 'password'); if (!p1) return;
            if (p1.length < 4) { toast('الرمز قصير'); return; }
            const p2 = await ask('أعد كتابة الرمز', '', false, 'password'); if (p1 !== p2) { toast('الرمزان غير متطابقين'); return; }
            await Store.setPin(p1); toast('تم تفعيل التشفير برمز الدخول'); this.render();
          } }, Store.pinEnabled() ? 'تغيير الرمز' : 'تفعيل رمز الدخول'),
          Store.pinEnabled() ? h('button', { class: 'btn', onclick: async () => { if (await confirmDlg('إلغاء رمز الدخول؟ ستُحفظ البيانات دون تشفير على هذا الجهاز.')) { await Store.removePin(); this.render(); } } }, 'إلغاء الرمز') : null)
          : h('p', { class: 'err' }, 'التشفير غير متاح في هذا المتصفح أو عند فتح الملف بهذه الطريقة.'),
        Store.pinEnabled() ? inp('الإغلاق التلقائي بعد (دقائق)', s, 'autoLockMin', { type: 'number', dir: 'ltr' }) : null),
      card('النسخ الاحتياطي',
        h('p', { class: 'muted' }, Store.state.lastBackupAt ? `آخر نسخة: ${new Date(Store.state.lastBackupAt).toLocaleString('ar-u-nu-latn')}` : 'لم تُؤخذ نسخة احتياطية بعد.'),
        h('p', { class: 'muted small' }, 'ملف النسخة مشفّر بكلمة مرور تختارها. احفظه في iCloud Drive أو على قرص خارجي. بدون كلمة المرور لا يمكن فتحه.'),
        h('div', { class: 'row actions' },
          h('button', { class: 'btn primary', onclick: () => this.doBackup(), disabled: !hasCrypto() }, 'إنشاء نسخة مشفّرة'),
          h('button', { class: 'btn', onclick: () => this.doRestore(), disabled: !hasCrypto() }, 'استعادة من نسخة'))),
      card('منطقة الخطر',
        h('button', { class: 'btn danger', onclick: async () => {
          const t = await ask('لحذف كل الوصفات والإعدادات من هذا الجهاز اكتب: حذف', ''); if (t !== 'حذف') return;
          await KV.del('state'); await KV.del('meta'); location.reload();
        } }, 'حذف كل البيانات من هذا الجهاز')),
      h('p', { class: 'muted small center' }, `BHC Rx ${APP_VERSION} · يعمل دون إنترنت · لا تُرسل أي بيانات إلى أي خادم`));
  },

  signaturePad() {
    const cv = h('canvas', { class: 'sig', width: 600, height: 220, 'aria-label': 'لوحة التوقيع' }), ctx = cv.getContext('2d');
    let drawing = false, dirty = false;
    const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
    ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b2a4a';
    cv.addEventListener('pointerdown', (e) => { drawing = true; dirty = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); });
    cv.addEventListener('pointermove', (e) => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); });
    cv.addEventListener('pointerup', () => { drawing = false; });
    const cur = Store.state.signature ? h('img', { src: Store.state.signature, class: 'sig-cur', alt: 'التوقيع المحفوظ' }) : h('p', { class: 'muted' }, 'لا يوجد توقيع محفوظ.');
    const file = h('input', { type: 'file', accept: 'image/*', hidden: true });
    file.addEventListener('change', async () => { const f = file.files[0]; if (!f) return; const url = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); }); Store.state.signature = url; await Store.save(); await this.refreshAssets(); this.render(); toast('تم حفظ التوقيع'); });
    return h('div', {}, h('p', { class: 'muted small' }, 'ارسم توقيعك بإصبعك أو بالقلم مرة واحدة ثم احفظه. يظهر على الوصفات تلقائياً.'), cur, cv,
      h('div', { class: 'row actions' },
        h('button', { class: 'btn primary', onclick: async () => { if (!dirty) { toast('ارسم التوقيع أولاً'); return; } Store.state.signature = cropCanvas(cv); await Store.save(); await this.refreshAssets(); this.render(); toast('تم حفظ التوقيع'); } }, 'حفظ التوقيع'),
        h('button', { class: 'btn', onclick: () => { ctx.clearRect(0, 0, cv.width, cv.height); dirty = false; } }, 'مسح اللوحة'),
        h('button', { class: 'btn', onclick: () => file.click() }, 'رفع صورة'), file,
        Store.state.signature ? h('button', { class: 'btn', onclick: async () => { Store.state.signature = ''; await Store.save(); await this.refreshAssets(); this.render(); } }, 'حذف التوقيع') : null));
  },

  async doBackup() {
    if (!hasCrypto()) return;
    const p1 = await ask('كلمة مرور النسخة (8 أحرف على الأقل)', '', false, 'password'); if (!p1) return;
    if (p1.length < 8) { toast('كلمة المرور قصيرة'); return; }
    const p2 = await ask('أعد كتابة كلمة المرور', '', false, 'password'); if (p1 !== p2) { toast('الكلمتان غير متطابقتين'); return; }
    busy(true);
    try {
      Store.state.lastBackupAt = Date.now();
      const data = await Store.exportBackup(p1); await Store.save();
      const d = new Date(), name = `BHC-Rx-backup-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}.bhcrx`;
      const file = new File([JSON.stringify(data)], name, { type: 'application/octet-stream' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); } catch (e) { if (e.name !== 'AbortError') download(file); } } else download(file);
      toast('تم إنشاء النسخة المشفّرة'); this.render();
    } finally { busy(false); }
  },
  async doRestore() {
    const f = await pickFile('.bhcrx,application/octet-stream,application/json'); if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch { toast('ملف غير صالح'); return; }
    const pw = await ask('كلمة مرور النسخة', '', false, 'password'); if (!pw) return;
    busy(true);
    try { const st = await Store.readBackup(data, pw); const r = Store.merge(st); await Store.save(); await this.refreshAssets(); toast(`تمت الاستعادة: ${r.added} جديدة، ${r.updated} محدّثة`); this.render(); }
    catch (e) { toast(e.message === 'FORMAT' ? 'هذا ليس ملف نسخة احتياطية للوصفات' : 'كلمة المرور غير صحيحة أو الملف تالف'); }
    finally { busy(false); }
  },
};

/* ---------- small UI helpers ---------- */
function card(title, ...kids) { return h('section', { class: 'card' }, h('h2', {}, title), ...kids); }
function chips(list, fn) { return h('div', { class: 'chips' }, ...list.map((t) => h('button', { type: 'button', class: 'chip', onclick: () => fn(t) }, t))); }
function menuItem(title, sub, fn) { return h('button', { class: 'menu-item', 'data-close': '1', onclick: fn }, h('strong', {}, title), h('span', { class: 'muted small' }, sub)); }
function toast(msg, ms = 2200) { const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(t); setTimeout(() => t.classList.add('out'), ms); setTimeout(() => t.remove(), ms + 500); }
function busy(on) { document.body.classList.toggle('busy', on); }
function download(file) { const a = h('a', { href: URL.createObjectURL(file), download: file.name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
function loadImg(src) { return new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
function pickFile(accept) { return new Promise((res) => { const i = h('input', { type: 'file', accept, hidden: true }); i.addEventListener('change', () => res(i.files[0] || null)); document.body.append(i); i.click(); setTimeout(() => i.remove(), 60000); }); }
function cropCanvas(cv) {
  const ctx = cv.getContext('2d'), { width: w, height: hh } = cv, data = ctx.getImageData(0, 0, w, hh).data;
  let x0 = w, y0 = hh, x1 = 0, y1 = 0;
  for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) if (data[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const out = document.createElement('canvas'); out.width = Math.max(1, x1 - x0 + 16); out.height = Math.max(1, y1 - y0 + 16);
  out.getContext('2d').drawImage(cv, x0 - 8, y0 - 8, out.width, out.height, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}
function sheet(title, body, buttons, o = {}) {
  const dlg = h('dialog', { class: `sheet ${o.wide ? 'wide' : ''}` });
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.append(h('div', { class: 'sheet-head' }, h('strong', {}, title), h('button', { class: 'icon-btn', 'aria-label': 'إغلاق', onclick: close }, '✕')), body,
    buttons.filter(Boolean).length ? h('div', { class: 'sheet-foot' }, ...buttons.filter(Boolean).map(([l, cls, fn]) => h('button', { class: `btn ${cls}`, onclick: async () => { if ((await fn()) !== false) close(); } }, l))) : null);
  dlg.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) setTimeout(close, 0); if (e.target === dlg) close(); });
  dlg.addEventListener('cancel', close);
  document.body.append(dlg); dlg.showModal();
  return dlg;
}
function ask(label, value = '', multiline = false, type = 'text') {
  return new Promise((res) => {
    const el = multiline ? h('textarea', { rows: 8 }) : h('input', { type, autocomplete: type === 'password' ? 'new-password' : 'off' });
    el.value = value;
    let done = false; const finish = (v) => { if (!done) { done = true; res(v); } };
    const dlg = sheet(label, h('div', { class: 'sheet-body' }, el), [['موافق', 'primary', () => finish(el.value.trim())], ['إلغاء', '', () => finish('')]]);
    dlg.addEventListener('close', () => finish(''));
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !multiline) { finish(el.value.trim()); dlg.close(); dlg.remove(); } });
    setTimeout(() => el.focus(), 60);
  });
}
function confirmDlg(msg) {
  return new Promise((res) => {
    let done = false; const finish = (v) => { if (!done) { done = true; res(v); } };
    const dlg = sheet('تأكيد', h('div', { class: 'sheet-body' }, h('p', {}, msg)), [['نعم', 'danger', () => finish(true)], ['إلغاء', '', () => finish(false)]]);
    dlg.addEventListener('close', () => finish(false));
  });
}

window.addEventListener('beforeunload', () => { if (Store.state) App.saveDraft(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && Store.state) App.saveDraft(); });
App.boot();
